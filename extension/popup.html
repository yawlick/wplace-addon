<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wplace Auto Color</title>
  <style>
    body { width: 220px; margin: 0; padding: 14px; color: #e8edf5; background: #111722; font: 13px/1.4 system-ui,sans-serif; }
    h1 { margin: 0 0 10px; font-size: 15px; }
    label { display:flex; justify-content:space-between; align-items:center; }
    button { width:100%; margin-top:12px; padding:8px; border:0; border-radius:8px; color:#081018; background:#7dd3fc; cursor:pointer; font-weight:700; }
    p { margin:10px 0 0; color:#8f9bac; font-size:11px; }
  </style>
</head>
<body>
  <h1>Pixel Auto Color</h1>
  <label><span>Автоматизация</span><input id="enabled" type="checkbox"></label>
  <button id="open">Открыть wplace.live</button>
  <p>Удерживай Q и веди мышью. F8 переключает режим.</p>
  <script src="popup.js"></script>
</body>
</html>
